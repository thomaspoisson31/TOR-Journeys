
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Voyages en Terre du Milieu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <i class="fas fa-map-marked-alt text-6xl text-blue-500 mb-4"></i>
            <h1 class="text-3xl font-bold mb-2">Voyages en Terre du Milieu</h1>
            <p class="text-gray-400">Connectez-vous pour accéder à votre aventure</p>
        </div>
        
        <div id="login-status" class="mb-6 hidden">
            <div class="bg-blue-900/20 border border-blue-500 rounded p-4 text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-3"></div>
                <p class="text-blue-400">Vérification de l'authentification...</p>
            </div>
        </div>

        <div id="login-content">
            <button id="google-signin-btn" class="w-full flex items-center justify-center gap-3 px-6 py-3 bg-white text-gray-900 rounded-lg shadow-md hover:bg-gray-100 transition-colors font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Se connecter avec Google</span>
            </button>

            <div class="mt-6 p-4 bg-gray-900 rounded-lg border border-gray-700">
                <h3 class="font-semibold mb-2 flex items-center">
                    <i class="fas fa-info-circle text-blue-400 mr-2"></i>
                    Authentification requise
                </h3>
                <p class="text-sm text-gray-400">
                    Un compte Google est nécessaire pour sauvegarder et synchroniser vos données de voyage en Terre du Milieu.
                </p>
            </div>
        </div>
    </div>

    <script>
        async function checkAuth() {
            document.getElementById('login-status').classList.remove('hidden');
            
            try {
                const response = await fetch('/api/auth/user', {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.authenticated) {
                    // Rediriger vers l'application
                    window.location.href = '/';
                } else {
                    document.getElementById('login-status').classList.add('hidden');
                }
            } catch (error) {
                console.error('Erreur vérification auth:', error);
                document.getElementById('login-status').classList.add('hidden');
            }
        }

        document.getElementById('google-signin-btn').addEventListener('click', () => {
            window.location.href = '/auth/google';
        });

        // Vérifier si déjà authentifié
        checkAuth();

        // Vérifier succès auth dans URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('auth_success')) {
            window.history.replaceState({}, document.title, '/login');
            checkAuth();
        } else if (urlParams.has('auth_error')) {
            const errorDesc = urlParams.get('desc') || 'Erreur inconnue';
            alert(`Erreur d'authentification: ${errorDesc}`);
            window.history.replaceState({}, document.title, '/login');
        }
    </script>
</body>
</html>
